services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everfit
      POSTGRES_PASSWORD: everfit
      POSTGRES_DB: everfit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everfit -d everfit"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://everfit:everfit@db:5432/everfit
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
