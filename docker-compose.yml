services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: everfit
      POSTGRES_PASSWORD: everfit
      POSTGRES_DB: everfit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everfit -d everfit"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
